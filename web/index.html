<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>expecta — is it safe?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root {
    --bg: #FAF6F0;
    --ink: #1F2933;
    --ink-soft: #6E7A87;
    --card: #FFFFFF;
    --radius: 16px;
    --spacing: 16px;
    --safe: #2E7D5B;      --safe-wash: #E7F2EC;
    --caution: #B45309;   --caution-wash: #FBF0E1;
    --avoid: #B3382E;     --avoid-wash: #F9E9E7;
    --unknown: #5B6672;   --unknown-wash: #EDEFF2;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    transition: background-color 0.4s ease;
  }
  body.wash-SAFE    { background: var(--safe-wash); }
  body.wash-CAUTION { background: var(--caution-wash); }
  body.wash-AVOID   { background: var(--avoid-wash); }
  body.wash-UNKNOWN { background: var(--unknown-wash); }

  .shell { max-width: 480px; margin: 0 auto; min-height: 100dvh;
           display: flex; flex-direction: column; padding: var(--spacing); }
  .view { display: none; flex: 1; flex-direction: column; }
  .view.active { display: flex; animation: fadein 0.25s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }

  /* ---- header ---- */
  header { display: flex; flex-direction: column; gap: 12px; padding-bottom: var(--spacing); }
  .wordmark { font-family: "Fraunces", serif; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .wordmark small { font-family: "Inter"; font-size: 12px; font-weight: 400; color: var(--ink-soft); margin-left: 8px; }
  .stages { display: flex; gap: 8px; }
  .pill {
    flex: 1; padding: 8px 0; text-align: center; font-size: 13px; font-weight: 500;
    border: 1.5px solid var(--ink); border-radius: 999px; background: transparent;
    color: var(--ink); cursor: pointer; font-family: inherit; transition: all 0.15s ease;
  }
  .pill.active { background: var(--ink); color: #fff; }
  .pill:active { transform: scale(0.96); }

  /* ---- search ---- */
  .searchrow { display: flex; gap: 8px; padding-bottom: var(--spacing); }
  .searchrow input {
    flex: 1; padding: 12px 16px; font: 15px "Inter"; color: var(--ink);
    border: 1.5px solid #D8D2C8; border-radius: var(--radius); background: var(--card); outline: none;
  }
  .searchrow input:focus { border-color: var(--ink); }
  .searchrow button {
    padding: 12px 20px; font: 600 14px "Inter"; border: none; cursor: pointer;
    border-radius: var(--radius); background: var(--ink); color: #fff;
  }

  /* ---- scanner ---- */
  .camwrap { position: relative; border-radius: var(--radius); overflow: hidden;
             background: #14181D; aspect-ratio: 3/4; }
  #reader { width: 100%; height: 100%; }
  #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  .reticle {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none; gap: 14px;
  }
  .reticle .box { width: 70%; height: 34%; border: 2.5px solid rgba(255,255,255,0.9);
                  border-radius: var(--radius); box-shadow: 0 0 0 2000px rgba(0,0,0,0.25); }
  .reticle p { color: #fff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  .camnote { padding-top: 10px; font-size: 13px; color: var(--ink-soft); text-align: center; }

  /* ---- search results ---- */
  .results { display: flex; flex-direction: column; gap: 10px; padding-top: 4px; }
  .result-card {
    display: flex; gap: 12px; align-items: center; background: var(--card);
    border-radius: var(--radius); padding: 12px; cursor: pointer; border: none;
    text-align: left; font-family: inherit; box-shadow: 0 1px 3px rgba(31,41,51,0.08);
    transition: transform 0.1s ease;
  }
  .result-card:active { transform: scale(0.98); }
  .result-card img { width: 48px; height: 48px; object-fit: contain; border-radius: 8px; background: #F3EFE8; }
  .result-card .noimg { width: 48px; height: 48px; border-radius: 8px; background: #F3EFE8;
    display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .result-card .rname { font-size: 15px; font-weight: 600; color: var(--ink); }
  .result-card .rbrand { font-size: 13px; color: var(--ink-soft); }

  /* ---- loading ---- */
  #view-loading { align-items: center; justify-content: center; }
  .pulse { font-size: 17px; color: var(--ink); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

  /* ---- verdict ---- */
  #view-verdict { gap: 12px; }
  .verdict-word { font-family: "Fraunces", serif; font-size: 64px; font-weight: 600;
                  line-height: 1.05; letter-spacing: -0.02em; }
  .verdict-word.v-SAFE { color: var(--safe); }
  .verdict-word.v-CAUTION { color: var(--caution); }
  .verdict-word.v-AVOID { color: var(--avoid); }
  .verdict-word.v-UNKNOWN { color: var(--unknown); }
  .pname { font-family: "Fraunces", serif; font-size: 20px; color: var(--ink); }
  .stageline { font-size: 13px; color: var(--ink-soft); }
  .reasoning { font-size: 16px; line-height: 1.5; color: var(--ink); padding-top: 4px; }
  .flags { display: flex; flex-direction: column; gap: 10px; padding-top: 8px; flex: 1; }
  .flag-card { background: var(--card); border-radius: var(--radius); padding: 14px;
               box-shadow: 0 1px 3px rgba(31,41,51,0.08); }
  .flag-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .flag-name { font-weight: 600; font-size: 15px; }
  .chip { font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  .chip.v-SAFE { color: var(--safe); background: var(--safe-wash); }
  .chip.v-CAUTION { color: var(--caution); background: var(--caution-wash); }
  .chip.v-AVOID { color: var(--avoid); background: var(--avoid-wash); }
  .chip.v-UNKNOWN { color: var(--unknown); background: var(--unknown-wash); }
  .flag-reason { font-size: 13px; color: var(--ink-soft); padding-top: 6px; line-height: 1.45; }
  .confline { font-size: 12px; color: var(--ink-soft); }

  footer { padding-top: var(--spacing); display: flex; flex-direction: column; gap: 10px; }
  .disclaimer { font-size: 12px; color: var(--ink-soft); text-align: center; }
  .bigbtn { width: 100%; padding: 16px; font: 600 16px "Inter"; border: none; cursor: pointer;
            border-radius: var(--radius); background: var(--ink); color: #fff; }
  .bigbtn:active { transform: scale(0.98); }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="wordmark">expecta <small>is it safe?</small></div>
    <div class="stages" id="stages">
      <button class="pill active" data-stage="trimester_1">T1</button>
      <button class="pill" data-stage="trimester_2">T2</button>
      <button class="pill" data-stage="trimester_3">T3</button>
      <button class="pill" data-stage="breastfeeding">Nursing</button>
    </div>
  </header>

  <!-- SCAN + SEARCH -->
  <div class="view active" id="view-scan">
    <div class="searchrow">
      <input id="searchbox" type="text" placeholder="Search any product, or type a barcode…"
             autocomplete="off" />
      <button id="searchbtn">Check</button>
    </div>
    <div class="camwrap">
      <div id="reader"></div>
      <div class="reticle">
        <div class="box"></div>
        <p>Point at a barcode</p>
      </div>
    </div>
    <p class="camnote" id="camnote">Camera starting…</p>
    <div class="results" id="results"></div>
  </div>

  <!-- LOADING -->
  <div class="view" id="view-loading">
    <p class="pulse">Checking ingredients…</p>
  </div>

  <!-- VERDICT -->
  <div class="view" id="view-verdict">
    <div class="verdict-word" id="vword"></div>
    <div class="pname" id="vproduct"></div>
    <div class="stageline" id="vstage"></div>
    <p class="reasoning" id="vreasoning"></p>
    <div class="confline" id="vconf"></div>
    <div class="flags" id="vflags"></div>
    <footer>
      <p class="disclaimer">Informational screening — not medical advice.</p>
      <button class="bigbtn" id="againbtn">Scan again</button>
    </footer>
  </div>
</div>

<script>
const API = "";  // same origin — FastAPI serves this page
const STAGE_LABEL = {
  trimester_1: "1st trimester", trimester_2: "2nd trimester",
  trimester_3: "3rd trimester", breastfeeding: "breastfeeding",
};
let stage = "trimester_1";
let scanner = null;
let scanning = false;

function show(id) {
  document.querySelectorAll(".view").forEach(v => v.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* ---- stage pills ---- */
document.getElementById("stages").addEventListener("click", e => {
  const btn = e.target.closest(".pill");
  if (!btn) return;
  document.querySelectorAll(".pill").forEach(p => p.classList.remove("active"));
  btn.classList.add("active");
  stage = btn.dataset.stage;
});

/* ---- scanner ---- */
async function startScanner() {
  const note = document.getElementById("camnote");
  try {
    if (!scanner) {
      scanner = new Html5Qrcode("reader", {
        formatsToSupport: [
          Html5QrcodeSupportedFormats.EAN_13,
          Html5QrcodeSupportedFormats.UPC_A,
          Html5QrcodeSupportedFormats.EAN_8,
          Html5QrcodeSupportedFormats.UPC_E,
        ],
      });
    }
    if (scanning) return;
    await scanner.start(
      { facingMode: "environment" },
      { fps: 10, qrbox: { width: 260, height: 140 } },
      onScan,
      () => {}
    );
    scanning = true;
    note.textContent = "Or search above if scanning is awkward.";
  } catch (err) {
    note.textContent = "Camera unavailable — use the search box above.";
  }
}
async function stopScanner() {
  if (scanner && scanning) {
    scanning = false;
    try { await scanner.stop(); } catch (_) {}
  }
}
function onScan(text) {
  if (navigator.vibrate) navigator.vibrate(60);
  checkBarcode(text);
}

/* ---- verdict fetch ---- */
async function checkBarcode(barcode) {
  await stopScanner();
  show("view-loading");
  document.body.className = "";
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 45000);
  try {
    const res = await fetch(API + "/scan", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ barcode, stage }),
      signal: ctrl.signal,
    });
    renderVerdict(await res.json());
  } catch (err) {
    renderVerdict({
      product_name: "Couldn't check this product",
      verdict: "UNKNOWN",
      flagged_ingredients: [],
      reasoning: "The check timed out or the server is unreachable. Please try again.",
    });
  } finally {
    clearTimeout(timer);
  }
}

function renderVerdict(d) {
  const v = (d.verdict || "UNKNOWN").toUpperCase();
  document.body.className = "wash-" + v;
  const word = { SAFE: "Safe", CAUTION: "Caution", AVOID: "Avoid", UNKNOWN: "Unknown" }[v] || "Unknown";
  const w = document.getElementById("vword");
  w.textContent = word;
  w.className = "verdict-word v-" + v;
  document.getElementById("vproduct").textContent = d.product_name || "";
  document.getElementById("vstage").textContent = "Checked for: " + STAGE_LABEL[stage];
  document.getElementById("vreasoning").textContent = d.reasoning || "";
  document.getElementById("vconf").textContent =
    typeof d.confidence === "number" && d.confidence > 0
      ? "Confidence: " + Math.round(d.confidence * 100) + "%" : "";
  const flags = document.getElementById("vflags");
  flags.innerHTML = "";
  for (const f of d.flagged_ingredients || []) {
    const r = (f.risk || "UNKNOWN").toUpperCase();
    const card = document.createElement("div");
    card.className = "flag-card";
    card.innerHTML =
      `<div class="flag-top"><span class="flag-name"></span>` +
      `<span class="chip v-${r}">${r}</span></div>` +
      `<div class="flag-reason"></div>`;
    card.querySelector(".flag-name").textContent = f.name;
    card.querySelector(".flag-reason").textContent = f.reason || "";
    flags.appendChild(card);
  }
  show("view-verdict");
}

/* ---- search any product ---- */
async function doSearch() {
  const q = document.getElementById("searchbox").value.trim();
  if (!q) return;
  if (/^\d{8,14}$/.test(q)) { checkBarcode(q); return; }  // typed a barcode
  const box = document.getElementById("results");
  box.innerHTML = '<p class="camnote">Searching…</p>';
  try {
    const res = await fetch(API + "/search?q=" + encodeURIComponent(q));
    const data = await res.json();
    box.innerHTML = "";
    if (!data.results.length) {
      box.innerHTML = '<p class="camnote">No products found — try another name.</p>';
      return;
    }
    for (const p of data.results) {
      const card = document.createElement("button");
      card.className = "result-card";
      card.innerHTML =
        (p.image ? `<img src="${p.image}" alt="" onerror="this.outerHTML='<div class=noimg>🧴</div>'" />`
                 : `<div class="noimg">🧴</div>`) +
        `<div><div class="rname"></div><div class="rbrand"></div></div>`;
      card.querySelector(".rname").textContent = p.name;
      card.querySelector(".rbrand").textContent = p.brand;
      card.addEventListener("click", () => checkBarcode(p.barcode));
      box.appendChild(card);
    }
  } catch (err) {
    box.innerHTML = '<p class="camnote">Search failed — is the server running?</p>';
  }
}
document.getElementById("searchbtn").addEventListener("click", doSearch);
document.getElementById("searchbox").addEventListener("keydown", e => {
  if (e.key === "Enter") doSearch();
});

/* ---- scan again ---- */
document.getElementById("againbtn").addEventListener("click", () => {
  document.body.className = "";
  document.getElementById("results").innerHTML = "";
  document.getElementById("searchbox").value = "";
  show("view-scan");
  startScanner();
});

startScanner();
</script>
</body>
</html>
